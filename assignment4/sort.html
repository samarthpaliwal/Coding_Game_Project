<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 4 - Sorting User Input</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #2f5bea;
      --primary-dark: #1e43b8;
      --text: #1f2937;
      --muted: #6b7280;
      --error: #d93025;
      --success: #188038;
      --border: #d1d5db;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 18px 24px;
    }
    header h1 { margin: 0 0 8px 0; font-size: 22px; }
    nav a {
      color: #fff;
      text-decoration: none;
      margin-right: 16px;
      font-size: 14px;
      opacity: 0.85;
    }
    nav a.active, nav a:hover { opacity: 1; text-decoration: underline; }
    main {
      max-width: 520px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    h2 { margin-top: 0; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input, textarea {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
    }
    input:focus, textarea:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
    button {
      margin-top: 18px;
      padding: 10px 20px;
      font-size: 15px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: var(--primary-dark); }
    .error { color: var(--error); font-weight: 600; margin-top: 16px; white-space: pre-line; }
    .hint { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Assignment 4</h1>
    <nav>
      <a href="validation.html">Validation</a>
      <a href="sort.html" class="active">Sort</a>
      <a href="counter.html">Word Counter</a>
      <a href="guess.html">Guessing Game</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h2>Sorting User Input</h2>
      <p class="hint">You will be prompted for a list of comma-separated numbers (for example: 5, 3, 9, 1). They are sorted in ascending order with Bubble Sort.</p>

      <label for="original">Your input</label>
      <textarea id="original" rows="3" readonly></textarea>

      <label for="sorted">Sorted numbers</label>
      <textarea id="sorted" rows="3" readonly></textarea>

      <button type="button" onclick="askAndSort()">Enter numbers again</button>
      <p id="my_p" class="error"></p>
    </div>
  </main>

  <script>
    // Bubble Sort: repeatedly swap neighbouring elements that are out of order.
    function bubbleSort(arr) {
      var n = arr.length;
      for (var i = 0; i < n - 1; i++) {
        var swapped = false;
        for (var j = 0; j < n - 1 - i; j++) {
          if (arr[j] > arr[j + 1]) {
            var temp = arr[j];
            arr[j] = arr[j + 1];
            arr[j + 1] = temp;
            swapped = true;
          }
        }
        if (!swapped) break; // already sorted
      }
      return arr;
    }

    function askAndSort() {
      var input = window.prompt("Enter a list of comma-separated numbers:", "5, 3, 9, 1, 7");
      var my_p = document.getElementById("my_p");
      if (input === null) {
        my_p.innerText = "No input given. Click the button to try again.";
        return;
      }

      // Convert "5, 3, 9" into an array of numbers, skipping empty pieces
      var parts = input.split(",");
      var numbers = [];
      var bad = [];
      for (var i = 0; i < parts.length; i++) {
        var piece = parts[i].trim();
        if (piece === "") continue;
        var value = Number(piece);
        if (isNaN(value)) {
          bad.push(piece);
        } else {
          numbers.push(value);
        }
      }

      document.getElementById("original").value = input;

      if (bad.length > 0) {
        my_p.innerText = "These are not numbers: " + bad.join(", ");
        document.getElementById("sorted").value = "";
        return;
      }
      if (numbers.length === 0) {
        my_p.innerText = "Please enter at least one number.";
        document.getElementById("sorted").value = "";
        return;
      }

      my_p.innerText = "";
      var sorted = bubbleSort(numbers);
      document.getElementById("sorted").value = sorted.join(", ");
    }

    // Prompt as soon as the page loads
    window.onload = askAndSort;
  </script>
</body>
</html>
