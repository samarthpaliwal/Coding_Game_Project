<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 4 - Word Frequency Counter</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #2f5bea;
      --primary-dark: #1e43b8;
      --text: #1f2937;
      --muted: #6b7280;
      --error: #d93025;
      --success: #188038;
      --border: #d1d5db;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 18px 24px;
    }
    header h1 { margin: 0 0 8px 0; font-size: 22px; }
    nav a {
      color: #fff;
      text-decoration: none;
      margin-right: 16px;
      font-size: 14px;
      opacity: 0.85;
    }
    nav a.active, nav a:hover { opacity: 1; text-decoration: underline; }
    main {
      max-width: 520px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    h2 { margin-top: 0; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input, textarea {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
    }
    input:focus, textarea:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
    button {
      margin-top: 18px;
      padding: 10px 20px;
      font-size: 15px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: var(--primary-dark); }
    .error { color: var(--error); font-weight: 600; margin-top: 16px; white-space: pre-line; }
    .hint { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Assignment 4</h1>
    <nav>
      <a href="validation.html">Validation</a>
      <a href="sort.html">Sort</a>
      <a href="counter.html" class="active">Word Counter</a>
      <a href="guess.html">Guessing Game</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h2>Word Frequency Counter</h2>
      <p class="hint">Type a block of text. Words are separated by spaces and capitalization is ignored.</p>

      <label for="text">Your text</label>
      <textarea id="text" rows="6" placeholder="The quick brown fox jumps over the lazy dog the end"></textarea>

      <button type="button" onclick="countWords()">Count Words</button>

      <p id="my_p" style="white-space: pre-line;"></p>
    </div>
  </main>

  <script>
    function countWords() {
      var text = document.getElementById("text").value;
      var my_p = document.getElementById("my_p");

      // Split on spaces (and line breaks) and drop empty strings
      var words = text.split(/\s+/);
      var counts = {};
      var order = []; // remember first-seen order for display

      for (var i = 0; i < words.length; i++) {
        var word = words[i].toLowerCase();
        if (word === "") continue;
        if (counts[word] === undefined) {
          counts[word] = 0;
          order.push(word);
        }
        counts[word]++;
      }

      if (order.length === 0) {
        my_p.innerText = "Please type some text first.";
        return;
      }

      var lines = [];
      for (var k = 0; k < order.length; k++) {
        lines.push(order[k] + ": " + counts[order[k]]);
      }
      my_p.innerText = lines.join("\n");
    }
  </script>
</body>
</html>
