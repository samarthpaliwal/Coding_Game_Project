# One-click deploy on Render (free plan). https://render.com/deploy?repo=<this repo url>
services:
  - type: web
    name: partyline
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Optional: lets Cardsmith generate themed cards with Claude. Leave blank to use the built-in deck.
      - key: ANTHROPIC_API_KEY
        sync: false
